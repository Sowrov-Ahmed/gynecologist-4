<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-24 overflow-x-clip">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expert Women’s Healthcare in Dhaka &amp; Chattogram | Dr. Imran Chowdhury</title>
<meta name="description" content="Dr. Imran Chowdhury is a consultant obstetrician and gynecologic surgeon with chambers in Banani, Mohammadpur and Khulshi; book a consultation online.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body class="relative overflow-x-clip bg-night font-body text-mist antialiased" data-page="home">
<div id="site-header"></div>
<main id="main">

  <section id="hero" class="relative flex min-h-[100svh] flex-col overflow-hidden bg-night" data-mouse-scope aria-labelledby="hero-title">
    <div class="absolute -inset-y-[12%] inset-x-0" data-parallax="0.18" aria-hidden="true">
      <img src="assets/images/doctor-window.webp" width="1280" height="714" alt="" class="h-full w-full animate-kenburns object-cover object-right" fetchpriority="high">
    </div>
    <div class="absolute inset-0 bg-night/50 bg-gradient-to-r from-night-deep via-night/80 to-night/10 lg:bg-transparent" aria-hidden="true"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-night to-transparent" aria-hidden="true"></div>
    <div id="hero-grid" class="pointer-events-none absolute inset-0 text-white/[0.05]" aria-hidden="true"></div>

    <div class="pointer-events-none absolute -left-24 top-[12%]" data-mouse="-12" aria-hidden="true"><div class="h-72 w-72 animate-orb rounded-full bg-mint/20 blur-3xl"></div></div>
    <div class="pointer-events-none absolute -right-20 bottom-[18%]" data-mouse="18" aria-hidden="true"><div class="h-80 w-80 animate-orb rounded-full bg-seafoam/25 blur-3xl"></div></div>
    <div class="pointer-events-none absolute -bottom-[1vw] -left-[1vw] select-none" data-mouse="26" aria-hidden="true"><span class="block font-heading text-[18vw] font-extrabold leading-none text-transparent [-webkit-text-stroke:1px_rgba(107,227,179,0.25)]">CARE</span></div>

    <div class="relative z-10 mx-auto grid w-full max-w-7xl flex-1 items-center gap-10 px-5 pb-10 pt-12 sm:px-8 lg:grid-cols-12 lg:px-10">
      <div class="lg:col-span-7">
        <p class="inline-flex min-h-[44px] animate-slide-left items-center gap-3 rounded-lg border border-white/15 bg-white/10 px-4 py-2 text-xs font-semibold text-white backdrop-blur-xl">
          <span class="relative flex h-2.5 w-2.5"><span class="absolute inset-0 animate-pulse-ring rounded-full bg-mint"></span><span class="relative h-2.5 w-2.5 rounded-full bg-mint"></span></span>
          <span id="hero-status">Consultations by appointment</span>
        </p>
        <h1 id="hero-title" class="mt-6 animate-slide-left font-heading text-4xl font-bold leading-[1.08] tracking-tight text-white [animation-delay:150ms] sm:text-5xl lg:text-6xl">Expert Women’s Healthcare, <span class="bg-gradient-to-r from-mint via-mint-soft to-seafoam bg-clip-text text-transparent">Delivered With Precision</span></h1>
        <p class="mt-5 max-w-xl animate-slide-left text-base leading-relaxed text-mist [animation-delay:300ms] sm:text-lg">Specialist pregnancy, fertility and gynecologic surgery care from a consultant with 15 years of experience, in Dhaka and Chattogram.</p>
        <div class="mt-8 flex animate-slide-left flex-wrap gap-3 [animation-delay:450ms]">
          <a href="appointment.html" id="hero-book" class="inline-flex items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-mint to-seafoam px-6 py-3 text-sm font-bold text-pine shadow-mint transition duration-300 hover:-translate-y-0.5 hover:shadow-mint-lg focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-mint/40">Book Appointment <span data-icon="arrow-right" data-cls="h-4 w-4"></span></a>
          <a href="tel:+8801912558204" id="hero-call" class="inline-flex items-center justify-center gap-2 rounded-lg border border-white/20 bg-white/10 px-6 py-3 text-sm font-semibold text-white backdrop-blur-xl transition duration-300 hover:bg-white/20 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-white/20"><span data-icon="phone" data-cls="h-4 w-4"></span> Call Now</a>
        </div>
      </div>
      
    </div>

    <div class="relative z-10 mx-auto w-full max-w-7xl px-5 pb-8 sm:px-8 lg:px-10 lg:pb-16">
      <form id="dock" class="rounded-2xl bg-gradient-to-br from-mint/60 via-white/10 to-seafoam/50 p-px" aria-label="Check appointment availability">
        <div class="grid gap-4 rounded-2xl border border-white/15 bg-night/70 p-4 shadow-glass backdrop-blur-2xl sm:grid-cols-2 lg:grid-cols-4 lg:items-end lg:p-5">
          <div><label for="dock-chamber" class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-mist">Chamber</label><select id="dock-chamber" class="w-full rounded-lg border border-white/15 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-mist/60 backdrop-blur-md transition [color-scheme:dark] focus:border-mint/60 focus:bg-white/10 focus:outline-none focus:ring-4 focus:ring-mint/20"></select></div>
          <div><label for="dock-service" class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-mist">Service</label><select id="dock-service" class="w-full rounded-lg border border-white/15 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-mist/60 backdrop-blur-md transition [color-scheme:dark] focus:border-mint/60 focus:bg-white/10 focus:outline-none focus:ring-4 focus:ring-mint/20"></select></div>
          <div><label for="dock-date" class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-mist">Date</label><input id="dock-date" type="date" class="w-full rounded-lg border border-white/15 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-mist/60 backdrop-blur-md transition [color-scheme:dark] focus:border-mint/60 focus:bg-white/10 focus:outline-none focus:ring-4 focus:ring-mint/20"></div>
          <a id="dock-go" href="appointment.html" class="inline-flex min-h-[46px] items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-mint to-seafoam px-6 py-3 text-sm font-bold text-pine shadow-mint transition duration-300 hover:-translate-y-0.5 hover:shadow-mint-lg focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-mint/40">Check availability <span data-icon="arrow-right" data-cls="h-4 w-4"></span></a>
        </div>
      </form>
    </div>
    <a href="#about" class="absolute bottom-3 left-1/2 hidden -translate-x-1/2 flex-col items-center gap-2 text-[10px] font-semibold uppercase tracking-[0.3em] text-mist transition hover:text-white focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-mint/40 lg:flex"><span class="h-5 w-5 animate-pulse-ring rounded-full border border-mint/60" aria-hidden="true"></span>Scroll</a>
  </section>

  <section id="about" class="relative -mt-[4vw] overflow-hidden bg-cream pb-16 pt-[calc(4rem+4vw)] text-pine [clip-path:polygon(0_4vw,100%_0,100%_100%,0_100%)] sm:pb-20 sm:pt-[calc(5rem+4vw)] lg:pb-24 lg:pt-[calc(6rem+4vw)]">
    <div id="about-body"></div>
  </section>

  <section id="services" class="relative overflow-hidden bg-gradient-to-b from-night via-forest/60 to-night py-16 text-white sm:py-20 lg:py-24">
    <div class="pointer-events-none absolute -left-24 top-10 h-72 w-72 animate-orb rounded-full bg-mint/15 blur-3xl" aria-hidden="true"></div>
    <div class="pointer-events-none absolute -right-24 bottom-10 h-80 w-80 animate-orb rounded-full bg-seafoam/20 blur-3xl" aria-hidden="true"></div>
    <div id="services-body" class="relative"></div>
  </section>

  <section id="chambers" class="relative overflow-hidden bg-cream py-16 text-pine sm:py-20 lg:py-24">
    <div id="chambers-body"></div>
  </section>

  <section id="appointment" class="relative overflow-hidden bg-night py-20 sm:py-28">
    <div class="absolute inset-0 bg-gradient-to-r from-night/95 via-night/80 to-night/60" aria-hidden="true"></div>
    <div id="appointment-body" class="relative"></div>
  </section>

  <section id="stories" class="relative overflow-hidden bg-night py-16 text-white sm:py-20 lg:py-24">
    <div class="pointer-events-none absolute left-1/2 top-0 h-64 w-64 -translate-x-1/2 animate-orb rounded-full bg-mint/10 blur-3xl" aria-hidden="true"></div>
    <div id="stories-body" class="relative"></div>
  </section>

  <section id="journal" class="relative overflow-hidden bg-cream py-16 text-pine sm:py-20 lg:py-24">
    <div class="mx-auto grid w-full max-w-7xl gap-12 px-5 sm:px-8 lg:grid-cols-12 lg:gap-14 lg:px-10">
      <div class="lg:col-span-5"><div id="journal-body"></div></div>
      <div class="lg:col-span-7">
        <div id="faq-head"></div>
        <div id="home-faq"></div>
        <div id="faq-link" class="mt-8"></div>
      </div>
    </div>
  </section>

</main>
<div id="site-footer"></div>
