<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-24 overflow-x-clip">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Journal | Dr. Imran Chowdhury</title>
<meta name="description" content="Practical articles on pregnancy, fertility, periods, surgery and menopause, written by Dr. Imran Chowdhury.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body class="relative overflow-x-clip bg-night font-body text-mist antialiased" data-page="blog">
<div id="site-header"></div>
<main id="main">
  <div id="page-head"></div>

  <section class="relative overflow-hidden bg-cream py-16 text-pine sm:py-20 lg:py-24 -mt-[4vw] [clip-path:polygon(0_4vw,100%_0,100%_100%,0_100%)] pt-[calc(4rem+4vw)] sm:pt-[calc(5rem+4vw)] lg:pt-[calc(6rem+4vw)]" aria-labelledby="articles-title">
    <div class="mx-auto w-full max-w-7xl px-5 sm:px-8 lg:px-10">
      <h2 id="articles-title" class="sr-only">Articles</h2>

      <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
        <div id="blog-tabs" class="flex gap-6 overflow-x-auto border-b border-pine/10" role="group" aria-label="Filter articles by category"></div>
        <div class="relative w-full lg:max-w-sm">
          <label for="blog-search" class="sr-only">Search articles</label>
          <span id="blog-search-icon" class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-pine/50"></span>
          <input id="blog-search" type="search" autocomplete="off" placeholder="Search articles" class="w-full rounded-lg border border-pine/15 bg-white/70 px-4 py-3 text-sm text-pine placeholder:text-pine/45 backdrop-blur-md transition focus:border-seafoam focus:bg-white focus:outline-none focus:ring-4 focus:ring-seafoam/20 pl-11">
        </div>
      </div>

      <div id="blog-featured" class="mt-10"></div>

      <p id="blog-count" class="mt-10 text-sm font-medium text-pine/70" aria-live="polite"></p>
      <div id="blog-grid" class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>

      <div id="blog-empty" class="mt-6 hidden rounded-2xl border border-white/80 bg-white/60 p-10 text-center shadow-glass-light backdrop-blur-xl">
        <h3 class="font-heading text-lg font-semibold text-pine">No articles found</h3>
        <p class="mx-auto mt-2 max-w-md text-sm leading-relaxed text-pine/80">Nothing matches your search. Try a different word or show every article.</p>
        <button id="blog-clear" type="button" class="mt-6 inline-flex items-center justify-center gap-2 rounded-lg bg-night px-6 py-3 text-sm font-semibold text-white transition duration-300 hover:-translate-y-0.5 hover:bg-forest focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-night/30">Clear filters</button>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/blog.js"></script>
</body>
</html>
