<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-24 overflow-x-clip">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Dr. Imran Chowdhury</title>
<meta name="description" content="Call, message or write to Dr. Imran Chowdhury's team for appointment help, report queries and feedback.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body class="relative overflow-x-clip bg-night font-body text-mist antialiased" data-page="contact" data-no-cta>
<div id="site-header"></div>
<main id="main">
  <div id="page-head"></div>

  <section id="reach" class="relative overflow-hidden bg-cream py-16 text-pine sm:py-20 lg:py-24 -mt-[4vw] [clip-path:polygon(0_4vw,100%_0,100%_100%,0_100%)] pt-[calc(4rem+4vw)] sm:pt-[calc(5rem+4vw)] lg:pt-[calc(6rem+4vw)]" aria-label="Reach us">
    <div class="pointer-events-none absolute -left-24 top-32 h-72 w-72 animate-orb rounded-full bg-seafoam/20 blur-3xl"></div>
    <div class="relative mx-auto grid w-full max-w-7xl gap-8 px-5 sm:px-8 lg:grid-cols-5 lg:gap-10 lg:px-10">
      <div id="reach-info" class="lg:col-span-2" data-reveal="right"></div>
      <div id="reach-form" class="lg:col-span-3" data-reveal="left"></div>
    </div>
  </section>

  <section id="map-section" class="relative overflow-hidden bg-night py-16 text-white sm:py-20 lg:py-24" aria-label="Chamber maps">
    <div class="pointer-events-none absolute -right-24 top-10 h-72 w-72 animate-orb rounded-full bg-mint/10 blur-3xl"></div>
    <div class="relative mx-auto w-full max-w-7xl px-5 sm:px-8 lg:px-10">
      <div id="map-head"></div>
      <div id="map-tabs" role="tablist" aria-label="Choose a chamber map" class="mt-8 flex flex-wrap gap-3"></div>
      <div id="map-panel" role="tabpanel" class="mt-6 grid gap-6 transition-opacity duration-300 lg:grid-cols-5" data-reveal="up"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/contact.js"></script>
</body>
</html>
