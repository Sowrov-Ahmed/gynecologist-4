<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-24 overflow-x-clip">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment | Dr. Imran Chowdhury</title>
<meta name="description" content="Book a consultation with Dr. Imran Chowdhury at Banani, Mohammadpur or Khulshi in five quick steps.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body class="relative overflow-x-clip bg-night font-body text-mist antialiased" data-page="appointment" data-no-cta>
<div id="site-header"></div>
<main id="main">
<div id="page-head"></div>
<section class="relative overflow-hidden bg-gradient-to-b from-night via-forest/60 to-night py-16 text-white sm:py-20 lg:py-24 -mt-[4vw] [clip-path:polygon(0_4vw,100%_0,100%_100%,0_100%)] pt-[calc(4rem+4vw)] sm:pt-[calc(5rem+4vw)] lg:pt-[calc(6rem+4vw)]">
  <div class="pointer-events-none absolute -right-24 top-10 h-72 w-72 animate-orb rounded-full bg-mint/15 blur-3xl" aria-hidden="true"></div>
  <div class="relative mx-auto w-full max-w-7xl px-5 sm:px-8 lg:px-10">
    <div id="console" class="grid grid-cols-[minmax(0,1fr)] items-start gap-8 lg:grid-cols-[minmax(0,1fr)_380px]">
      <div id="wizard" class="min-w-0">
        <ol id="stepper" class="grid grid-cols-5 gap-2" aria-label="Booking steps"></ol>
        <div class="mt-3 h-1 overflow-hidden rounded-full bg-white/10"><div id="ap-progress" class="h-full rounded-full bg-gradient-to-r from-mint to-seafoam transition-all duration-500"></div></div>
        <div id="panel" aria-live="polite" class="glass mt-6 p-5 sm:p-8"></div>
      </div>
      <aside id="ticket" aria-label="Booking summary" class="min-w-0 lg:sticky lg:top-28"></aside>
    </div>
    <div id="success" class="hidden"></div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/appointment.js"></script>
</body>
</html>
