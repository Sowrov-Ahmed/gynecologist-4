<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-24 overflow-x-clip">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chambers | Dr. Imran Chowdhury</title>
<meta name="description" content="Visit Dr. Imran Chowdhury at his chambers in Banani, Mohammadpur and Khulshi, with weekly hours, fees and directions.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body class="relative overflow-x-clip bg-night font-body text-mist antialiased" data-page="chambers">
<div id="site-header"></div>
<main id="main">
  <div id="page-head"></div>

  <section id="locations" class="relative overflow-hidden bg-cream py-16 text-pine sm:py-20 lg:py-24 -mt-[4vw] [clip-path:polygon(0_4vw,100%_0,100%_100%,0_100%)] pt-[calc(4rem+4vw)] sm:pt-[calc(5rem+4vw)] lg:pt-[calc(6rem+4vw)]" aria-label="Chamber locations">
    <div class="pointer-events-none absolute -right-24 top-24 h-72 w-72 animate-orb rounded-full bg-seafoam/20 blur-3xl"></div>
    <div class="relative mx-auto w-full max-w-7xl px-5 sm:px-8 lg:px-10">
      <div id="chamber-tabs" role="tablist" aria-label="Choose a chamber" class="grid gap-4 md:grid-cols-3"></div>
      <div id="chamber-panel" role="tabpanel" tabindex="0" class="mt-8 scroll-mt-28 transition-opacity duration-300 focus-visible:outline-none"></div>
    </div>
  </section>

  <section id="schedule" class="relative overflow-hidden bg-gradient-to-b from-night via-forest/60 to-night py-16 text-white sm:py-20 lg:py-24" aria-label="Weekly schedule">
    <div class="pointer-events-none absolute -left-24 bottom-10 h-72 w-72 animate-orb rounded-full bg-mint/10 blur-3xl"></div>
    <div class="relative mx-auto w-full max-w-7xl px-5 sm:px-8 lg:px-10">
      <div id="sched-head"></div>
      <div id="sched-table" class="mt-10" data-reveal="up"></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/chambers.js"></script>
</body>
</html>
